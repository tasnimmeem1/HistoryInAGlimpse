spring.application.name=animation-backend
supabase.url=https://seqwvzedxfqeytscrwsr.supabase.co
supabase.secret-key=${SUPABASE_SECRET_KEY}
server.address=127.0.0.1
server.port=8080
# Send ResponseStatusException reasons to the desktop app (shown on the login form).
spring.web.error.include-message=always
# Google sign-in. Leave these unset to hide the "Continue with Google" button.
# Set them in the run configuration, like the Supabase key; never commit the secret.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
