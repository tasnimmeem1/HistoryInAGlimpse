spring:
  config:
    import: "optional:file:.env[.properties],optional:file:animation-backend/.env[.properties]"
  application:
    name: animation-backend
  web:
    error:
      # Send error reasons to the desktop app (shown on the login form).
      include-message: always
  datasource:
    url: jdbc:h2:file:${user.home}/history-in-a-glimpse-stories;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

supabase:
  url: https://seqwvzedxfqeytscrwsr.supabase.co
  # The key is never written here. It comes from the environment variable SUPABASE_SECRET_KEY.
  secret-key: ${SUPABASE_SECRET_KEY:}

server:
  address: 127.0.0.1
  port: 8080

# Optional Google sign-in. Empty unless set, and then the Google button stays hidden.
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
